services:
  postgis:
    image: imresamu/postgis:17-3.5-alpine
    container_name: skthon-postgis
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skthon}
      POSTGRES_USER: ${POSTGRES_USER:-skthon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Makes the repository's reproducible seed runner available when the
      # host does not have a psql client installed.
      - .:/opt/skthon/infra/databases:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
