AWSTemplateFormatVersion: '2010-09-09'
Description: SKTHON shared deployment resources (ECR, S3, logs, GitHub OIDC)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  GitHubRepository:
    Type: String
    Default: SKTHON2026-Hackathon-Oide/Backend
  GitHubSubject:
    Type: String
    Default: repo:SKTHON2026-Hackathon-Oide@326796625/Backend@1362204561:environment:dev

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub skthon-${Environment}-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: deployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource:
                  - !GetAtt BackendRepository.Arn
                  - !GetAtt McpRepository.Arn
                  - !GetAtt CodexAgentRepository.Arn
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/skthon-${Environment}-*
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:PutParameter
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/skthon/${Environment}/config/*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/skthon-${Environment}-compute/*

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub skthon/${Environment}/backend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  McpRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub skthon/${Environment}/mcp
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  CodexAgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub skthon/${Environment}/codex-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  JobBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub skthon-${Environment}-${AWS::AccountId}-${AWS::Region}-codex-jobs
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAgentArtifacts
            Status: Enabled
            ExpirationInDays: 7

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /skthon/${Environment}/backend
      RetentionInDays: 14

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /skthon/${Environment}/mcp
      RetentionInDays: 14

  CodexAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /skthon/${Environment}/codex-agent
      RetentionInDays: 14

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Export:
      Name: !Sub skthon-${Environment}-github-deploy-role-arn
  JobBucketName:
    Value: !Ref JobBucket
    Export:
      Name: !Sub skthon-${Environment}-job-bucket
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  McpRepositoryUri:
    Value: !GetAtt McpRepository.RepositoryUri
  CodexAgentRepositoryUri:
    Value: !GetAtt CodexAgentRepository.RepositoryUri
